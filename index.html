<!DOCTYPE html>
<html>

<head>
  <title>Login Form</title>
  <link rel="stylesheet" href="Styles/login.css">
</head>

<body>

  <div class="container">
    <div class="box">
      <h2>Login</h2>
      <div class="form">
        <form>
          <div class="input-type">
            <input type="text" placeholder="Username" class="a" required>
          </div>

          <div class="input-type">
            <input type="password" placeholder="Password" class="b" required>
          </div>

          <div class="link">
            <a href="https://youtu.be/xvFZjo5PgG0?si=CHL279S-hTVchtDK" class="c">Forgot Password</a>
          </div>

          <div class="submit">
            <input type="submit" value="Login" class="d">
          </div>
          <div class="register">
            Don't have an account<a href="register.com" class="e"> Register</a>
          </div>

        </form>
      </div>
    </div>
  </div>

</body>


</html>
